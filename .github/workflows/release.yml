name: Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: # Adding content write permissions
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 1. First extract the version so it's available to all other steps
      - name: Extract version from tag
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # 2. Update metadata
      - name: Update version in metadata.json
        run: |
          VERSION=${{ steps.extract_version.outputs.version }}
          jq --arg version "$VERSION" '.versions[0].version = $version' metadata.json > tmp.json && mv tmp.json metadata.json

      # 3. Create archive (now the version variable already exists)
      - name: Archive repository
        run: |
          zip -r KicadDocsGenerator-${{ steps.extract_version.outputs.version }}.zip . --exclude ./.git/*

      # 4. Create release and upload file with one modern action
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.version }}
          name: Release ${{ steps.extract_version.outputs.version }}
          body: "Automatic release for version ${{ steps.extract_version.outputs.version }}"
          files: KicadDocsGenerator-${{ steps.extract_version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
